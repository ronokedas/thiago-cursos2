services:
  postgres:
    image: postgres:16-alpine
    container_name: aulas-online-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mecanica}
      POSTGRES_USER: ${POSTGRES_USER:-mecanica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mecanica_dev}
    volumes:
      - aulas_online_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d mecanica"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aulas-online
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://mecanica:mecanica_dev@postgres:5432/mecanica}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Mentoria A Mecânica <no-reply@localhost>}
      DEV_LOG_RESET_TOKEN: ${DEV_LOG_RESET_TOKEN:-true}
    volumes:
      - aulas_online_data:/app/data
      - aulas_online_videos:/app/data/videos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  aulas_online_data:
  aulas_online_videos:
  aulas_online_postgres:
